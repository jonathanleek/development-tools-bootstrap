; Insta360 Link Controller global shortcuts, merged into its startup.ini by
; scripts/streamdeck.sh. Must match "camera" in config.json. Only these
; sections live here: the rest of startup.ini holds login tokens.

[General]
enable_global_hotkey=true

[HotKey]
DeskView=Control + Option + Command + 3
Device1=Control + Option + 1
Device2=Control + Option + 2
Device3=Control + Option + 3
Device4=Control + Option + 4
GimbalDown=Control + Option + Command + K
GimbalLeft=Control + Option + Command + J
GimbalReset=Control + Option + Command + 0
GimbalRight=Control + Option + Command + L
GimbalUp=Control + Option + Command + I
PresetPosition1=Control + Option + Command + 1
PresetPosition2=Control + Option + Command + 2
ZoomIn=Control + Option + Command + +
ZoomOut=Control + Option + Command + -

